<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mini Collab Editor</title>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Mini Collab Editor</h1>
  <div id="meta">
    <span id="userId"></span>
    <button id="createDoc">Create New Document</button>
  </div>
  <div id="docs">
    <h3>Documents</h3>
    <ul id="docList"></ul>
  </div>
  <hr />
  <div id="editorPanel">
    <h3 id="docTitle">Not joined</h3>
    <div id="presence">Users online: <span id="presenceCount">0</span></div>
    <textarea id="editor" rows=20 cols=80 placeholder="Join or create a document..."></textarea>
    <div id="conflictMsg" style="color: red; display: none;">Conflict detected!</div>
  </div>

  <script src="/static/client.js"></script>
</body>
</html>
