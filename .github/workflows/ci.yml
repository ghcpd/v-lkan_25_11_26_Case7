name: Python Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip
        python -m pip install -r collab/requirements.txt
    - name: Run tests
      run: |
        source .venv/bin/activate
        pytest -vv --junitxml=pytest-report.xml --html=pytest-report.html --self-contained-html
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: pytest-results
        path: |
          pytest-report.xml
          pytest-report.html
